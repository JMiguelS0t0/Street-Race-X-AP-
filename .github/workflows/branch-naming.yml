# =============================================================================
# 🏎️ Street Race X — Branch Naming Convention Enforcer
# =============================================================================
# This workflow validates that branch names follow the project's naming
# convention on every push. Prevents non-conforming branches from reaching
# the remote.
# =============================================================================

name: "🔒 Branch Naming Convention"

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-name:
    name: "Validate Branch Name"
    runs-on: ubuntu-latest
    steps:
      - name: "🔍 Check branch naming convention"
        run: |
          # Extract branch name
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          echo "🔎 Branch name: $BRANCH"

          # Define the valid pattern
          # Format: <type>/<optional-ticket>-<description-in-kebab-case>
          # Examples:
          #   feature/srx-42-add-vehicle-photos
          #   bugfix/fix-rank-calculation
          #   hotfix/critical-auth-bypass
          #   release/v1.2.0
          #   docs/update-api-readme
          #   refactor/clean-auth-controller
          #   test/add-challenge-tests
          #   chore/update-dependencies

          VALID_PATTERN="^(feature|bugfix|hotfix|release|docs|refactor|test|chore)\/[a-z0-9][a-z0-9\-\.]*[a-z0-9]$"

          if [[ "$BRANCH" =~ $VALID_PATTERN ]]; then
            echo "✅ Branch name '$BRANCH' follows naming convention"
          else
            echo ""
            echo "❌ ERROR: Branch name '$BRANCH' does NOT follow the naming convention!"
            echo ""
            echo "📋 Expected format: <type>/<description-in-kebab-case>"
            echo "   Types: feature | bugfix | hotfix | release | docs | refactor | test | chore"
            echo ""
            echo "📝 Valid examples:"
            echo "   feature/add-vehicle-photos"
            echo "   feature/srx-42-add-vehicle-photos"
            echo "   bugfix/fix-rank-calculation"
            echo "   hotfix/critical-auth-bypass"
            echo "   release/v1.2.0"
            echo "   docs/update-api-readme"
            echo ""
            echo "💡 Use the branch creator script:"
            echo "   ./scripts/create-branch.ps1"
            echo ""
            exit 1
          fi

      - name: "📏 Check branch name length"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          LENGTH=${#BRANCH}
          if [ $LENGTH -gt 80 ]; then
            echo "⚠️ WARNING: Branch name is $LENGTH characters (max recommended: 80)"
            echo "Consider using a shorter, more concise name."
            exit 1
          else
            echo "✅ Branch name length: $LENGTH characters (OK)"
          fi
